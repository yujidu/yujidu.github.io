---
layout: compress
---

{% include base_path %}

<!doctype html>
<html lang="{{ site.locale | slice: 0,2 }}" class="no-js">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>

  <body class="{% if page.hero_image %}has-hero{% endif %}{% if site.banner_dark %} banner-dark{% endif %}{% if site.banner_veil %} banner-veil{% endif %}">

    {% include browser-upgrade.html %}
    {% include masthead.html %}

    {{ content }}

    <div class="page__footer">
      <footer>
        {% include footer/custom.html %}
        {% include footer.html %}
      </footer>
      <div class="footer-hero" aria-hidden="true">
        <img class="footer-hero__image" src="{{ site.footer_image | default: 'berkeley-footer.jpg' | prepend: '/images/' | relative_url }}" alt="" loading="lazy">
        <div class="footer-hero__fade"></div>
      </div>
    </div>

    {% include scripts.html %}
    <script>
      /* top bar: transparent over the banner, solid once the page scrolls */
      (function () {
        var bar = document.querySelector('.masthead');
        function update() { bar.classList.toggle('is-scrolled', window.scrollY > 10); }
        window.addEventListener('scroll', update, { passive: true });
        update();
      })();
    </script>

  </body>
</html>
