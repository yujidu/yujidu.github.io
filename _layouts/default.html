---
layout: compress
---

{% include base_path %}

<!doctype html>
<html lang="{{ site.locale | slice: 0,2 }}" class="no-js">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>

  <body class="{% if page.hero_image %}has-hero{% endif %}{% if site.banner_dark %} banner-dark{% endif %}{% if site.banner_veil %} banner-veil{% endif %}">

    {% include browser-upgrade.html %}
    {% include masthead.html %}

    {{ content }}

    <div class="page__footer">
      <footer>
        {% include footer/custom.html %}
        {% include footer.html %}
      </footer>
      <div class="footer-hero" aria-hidden="true">
        <img id="footer-img" class="footer-hero__image" src="{{ site.footer_image | default: 'berkeley-footer.jpg' | prepend: '/images/' | relative_url }}" alt="" loading="lazy"><script>window.applySkinTo(document.getElementById('footer-img'), 'footer');</script>
        <div class="footer-hero__fade"></div>
      </div>
    </div>

    {% include scripts.html %}
    <script>
      /* skin switcher menu */
      (function () {
        var wrap = document.querySelector('.skin-switch'); if (!wrap) return;
        var btn = wrap.querySelector('.skin-switch__btn'), menu = wrap.querySelector('.skin-switch__menu');
        var current = window.getSkin() || '{{ site.default_skin | default: "berkeley" }}';
        Object.keys(window.SKINS).forEach(function (k) {
          var sk = window.SKINS[k], b = document.createElement('button');
          b.type = 'button'; b.setAttribute('role', 'menuitemradio'); b.setAttribute('data-skin', k);
          var t = document.createElement('span'); t.className = 'skin-switch__thumb';
          t.style.backgroundImage = "url('" + sk.banner + "')";
          if (sk.pos) t.style.backgroundPosition = sk.pos;
          b.appendChild(t); b.appendChild(document.createTextNode(sk.name));
          menu.appendChild(b);
        });
        function mark() {
          menu.querySelectorAll('[data-skin]').forEach(function (b) {
            b.setAttribute('aria-checked', b.getAttribute('data-skin') === current);
          });
        }
        function close() { menu.hidden = true; btn.setAttribute('aria-expanded', 'false'); }
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          var open = menu.hidden;
          if (open) {
            var r = btn.getBoundingClientRect();
            menu.style.top = (r.bottom + 8) + 'px';
            menu.style.right = Math.max(8, document.documentElement.clientWidth - r.right) + 'px';
          }
          menu.hidden = !open; btn.setAttribute('aria-expanded', String(open));
        });
        document.addEventListener('click', function (e) { if (!wrap.contains(e.target)) close(); });
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
        menu.addEventListener('click', function (e) {
          var b = e.target.closest('[data-skin]'); if (!b) return;
          current = b.getAttribute('data-skin');
          try { localStorage.setItem('site-skin', current); } catch (err) {}
          var s = window.SKINS[current];
          window.setSkinClasses(s);
          var h = document.getElementById('hero-img'), f = document.getElementById('footer-img');
          if (h) { h.src = s.banner; h.style.objectPosition = s.pos; }
          if (f) { f.src = s.footer; }
          mark(); close();
        });
        mark();
      })();
    </script>
    <script>
      /* top bar: transparent over the banner, solid once the page scrolls */
      (function () {
        var bar = document.querySelector('.masthead');
        function update() { bar.classList.toggle('is-scrolled', window.scrollY > 10); }
        window.addEventListener('scroll', update, { passive: true });
        update();
      })();
    </script>

  </body>
</html>
