---
layout: compress
---

{% include base_path %}

<!doctype html>
<html lang="{{ site.locale | slice: 0,2 }}" class="no-js">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>

  <body{% if page.hero_image %} class="has-hero"{% endif %}>

    {% include browser-upgrade.html %}
    {% include masthead.html %}

    {{ content }}

    <div class="page__footer">
      <footer>
        {% include footer/custom.html %}
        {% include footer.html %}
      </footer>
      <div class="footer-hero" aria-hidden="true">
        <img class="footer-hero__image" src="{{ '/images/berkeley.jpg' | relative_url }}" alt="" loading="lazy">
        <div class="footer-hero__fade"></div>
      </div>
    </div>

    {% include scripts.html %}

  </body>
</html>
