<script>
/* One-click banner skins (menu button next to "Research"). The choice is
   remembered in this browser; without a choice the _config.yml banner is used. */
window.SKINS = {
  berkeley: { name: 'Berkeley Fall',  img: 'berkeley.jpg',        foot: 'berkeley-footer.jpg', pos: '',           veil: false, dark: false },
  snow:     { name: 'Snow Mountain',  img: 'lake-banner.jpg',     foot: 'lake-footer.jpg',     pos: 'center 85%', veil: true,  dark: false },
  autumn:   { name: 'Sierra Autumn',  img: 'autumn-banner.jpg',   foot: 'autumn-footer.jpg',   pos: 'center 15%', veil: true,  dark: false },
  pillars:  { name: 'Cosmic Pillars', img: 'pillars-banner.jpg',  foot: 'pillars-footer.jpg',  pos: 'center 20%', veil: false, dark: true  },
  dusk:     { name: 'Island Dusk',    img: 'dusk-banner.jpg',     foot: 'dusk-footer.jpg',     pos: 'center 40%', veil: true,  dark: false },
  winter:   { name: 'Winter Glow',    img: 'winterm-banner.jpg',  foot: 'winterm-footer.jpg',   pos: 'center 75%', veil: true,  dark: false },
  falls:    { name: 'Misty Falls',    img: 'falls-banner.jpg',    foot: 'falls-footer.jpg',    pos: 'center 40%', veil: true,  dark: false }
};
(function () {
  var base = '{{ "/images/" | relative_url }}';
  for (var k in window.SKINS) {
    window.SKINS[k].banner = base + window.SKINS[k].img;
    window.SKINS[k].footer = base + window.SKINS[k].foot;
  }
})();
window.getSkin = function () {
  try { var k = localStorage.getItem('site-skin'); return window.SKINS[k] ? k : null; } catch (e) { return null; }
};
window.setSkinClasses = function (s) {
  var c = document.documentElement.classList;
  c.toggle('skin-veil', s.veil); c.toggle('skin-noveil', !s.veil);
  c.toggle('skin-dark', s.dark); c.toggle('skin-light', !s.dark);
};
window.applySkinTo = function (img, part) {
  var k = window.getSkin(); if (!k || !img) return;
  var s = window.SKINS[k];
  if (img.getAttribute('src') !== s[part]) img.setAttribute('src', s[part]);
  if (part === 'banner') img.style.objectPosition = s.pos;
};
(function () {
  var k = window.getSkin(); if (k) window.setSkinClasses(window.SKINS[k]);
})();
</script>

<script>
/* Wide screens: scale the whole page (text and images) so it always fills the
   window like a 1920px-wide layout; browser zoom only enlarges it once the
   window is narrower than that. --vw keeps viewport units correct under zoom. */
(function () {
  var BASE = 1920, d = document.documentElement;
  if (!('zoom' in d.style)) return;
  function fit() {
    d.style.zoom = '';
    var w = d.clientWidth || window.innerWidth;
    if (w > BASE) {
      d.style.zoom = w / BASE;
      d.style.setProperty('--vw', (BASE / 100) + 'px');
    } else {
      d.style.removeProperty('--vw');
    }
  }
  fit();
  document.addEventListener('DOMContentLoaded', fit);
  window.addEventListener('load', fit);
  window.addEventListener('resize', fit);
})();
</script>
